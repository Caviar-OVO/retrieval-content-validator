[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "response-validation-agent"
version = "0.9.0"
description = "Validates LLM responses over web-search results: cognitive decomposition, vector-retrieval + NLI evidence verification, transparent layered output, factuality evaluation (five-level, source-anchored, fully local), an optional grounding-only judge report (Ragas / TruLens) kept separate from it, an honesty/auditability check, and an optional Reviser rewrite."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0"]

# Optional LLM-judge backends. Install with:  pip install -e ".[judges]"
# NOTE: ragas needs the older langchain 0.3.x core; the newest langchain-community
# removed `chat_models.vertexai`, which ragas hard-imports. These pins are tested
# to work together (ragas 0.2.15 + langchain 0.3.27 + trulens 2.14).
[project.optional-dependencies]
judges = [
    "openai>=1.0",
    "datasets>=2.0",
    "ragas==0.2.15",
    "langchain==0.3.27",
    "langchain-core==0.3.79",
    "langchain-community==0.3.31",
    "langchain-openai==0.3.35",
    "trulens==2.14.0",
    "trulens-providers-openai==2.14.0",
]

# Optional Streamlit console:  pip install -e ".[ui]"
ui = [
    "streamlit>=1.30",
]

[project.scripts]
rva = "rva.cli:main"

[tool.setuptools]
packages = ["rva", "rva.stages"]