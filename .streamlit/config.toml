# Streamlit console configuration.
# Loaded automatically when Streamlit runs from the repo root (locally and on
# Streamlit Community Cloud).

[server]
headless = true
# NOTE: leave the file watcher at its default. Pinning it to "none" would also
# apply to local runs (this file is read from the repo root), and a long-running
# local server would then never pick up edited source files.

[browser]
# Don't phone home usage stats from a public deployment.
gatherUsageStats = false

[theme]
primaryColor = "#4C78A8"
base = "light"
